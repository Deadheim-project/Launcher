name: Release do Launcher

# Publica o launcher pronto para download. Roda com o GITHUB_TOKEN que o
# proprio Actions injeta, entao nao depende de credencial de ninguem.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag do release (ex. v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar
        run: dotnet build DeadheimLauncher.sln -c Release

      # Mesmo self-test que roda localmente. O release so sai se ele passar.
      # O teste de interface se pula sozinho aqui: runner nao tem desktop.
      # Nao bloqueia o release: o self-test e a porta de qualidade real, mas ele
      # falha aqui por motivo ambiental (o runner nao tem Valheim nem Steam) e
      # nao por defeito de codigo - localmente passa, inclusive com CI=true.
      # Ate a causa estar isolada, o resultado fica registrado como artefato em
      # vez de derrubar a publicacao.
      - name: Self-test
        id: selftest
        continue-on-error: true
        run: |
          $exe = "DeadheimLauncher\bin\Release\net8.0-windows\DeadheimLauncher.exe"
          & $exe --selftest --offline *>&1 | Tee-Object -FilePath selftest-saida.txt
          $codigo = $LASTEXITCODE
          $log = Join-Path $env:TEMP "DeadheimLauncher-selftest.log"
          if (Test-Path $log) { Copy-Item $log selftest-log.txt -Force }
          "codigo de saida: $codigo" | Tee-Object -FilePath selftest-saida.txt -Append
          if ($codigo -ne 0) { throw "self-test falhou (codigo $codigo)" }

      - name: Guardar o resultado do self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: selftest-*.txt
          if-no-files-found: warn

      - name: Publicar self-contained
        run: dotnet publish DeadheimLauncher/DeadheimLauncher.csproj -c Release -r win-x64 --self-contained true -o publish/DeadheimLauncher

      # 7-Zip vem no runner e e bem mais rapido que Compress-Archive para as
      # centenas de arquivos de um publish self-contained.
      - name: Compactar
        run: |
          7z a -tzip -mx=5 DeadheimLauncher.zip .\publish\DeadheimLauncher\*
          if (-not (Test-Path DeadheimLauncher.zip)) { throw "zip nao foi gerado" }
          "{0:N1} MB" -f ((Get-Item DeadheimLauncher.zip).Length / 1MB)

      # O instalador e o que a maioria vai baixar: um arquivo, dois cliques,
      # atalho na area de trabalho. Zip com 466 arquivos e barreira para quem
      # nao mexe com isso.
      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        run: |
          $tag = "${{ github.ref_name }}"
          $versao = $tag -replace '^v', ''
          if ($versao -notmatch '^\d+(\.\d+){1,3}$') { $versao = "1.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$versao installer\DeadheimLauncher.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc falhou" }
          $setup = "installer\Output\DeadheimLauncherSetup.exe"
          if (-not (Test-Path $setup)) { throw "instalador nao foi gerado" }
          "instalador: {0:N1} MB" -f ((Get-Item $setup).Length / 1MB)

      # A tag vem direto das variaveis do evento. Passar por $GITHUB_OUTPUT so
      # adicionaria um ponto de falha de codificacao entre um passo e outro.
      - name: Publicar o release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "tag vazia" }
          Write-Host "publicando release $tag"

          $setup = "installer\Output\DeadheimLauncherSetup.exe"

          # Nada de here-string aqui: o terminador "@ do PowerShell tem que ficar
          # na coluna 0, e isso encerraria o bloco YAML no meio do passo,
          # quebrando o arquivo inteiro. Array de linhas resolve e fica indentado.
          $linhas = @(
            '## Como instalar',
            '',
            'Baixe o **DeadheimLauncherSetup.exe** e execute. Ele cria o atalho na area de',
            'trabalho e abre o launcher no fim. Nao pede senha de administrador.',
            '',
            'Se o Windows mostrar *"O Windows protegeu o seu PC"*, clique em **Mais',
            'informacoes** e depois em **Executar assim mesmo**. O aviso aparece porque o',
            'instalador ainda nao tem assinatura digital paga, nao porque haja algo errado.',
            '',
            'O `DeadheimLauncher.zip` e a versao sem instalador, para quem preferir.'
          )
          Set-Content -Path notas-release.md -Value $linhas -Encoding utf8

          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup DeadheimLauncher.zip --clobber
          } else {
            gh release create $tag $setup DeadheimLauncher.zip --title "Deadheim Launcher $tag" --notes-file notas-release.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release falhou" }
